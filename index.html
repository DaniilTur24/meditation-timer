<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Медитация — Таймер</title>
<style>
  :root{
    --timer-color: #cdd9e0;
    --card-bg: rgba(22,22,26,0.72);
    --card-border: rgba(255,255,255,0.09);
    --fg: #f0f0f2;
    --fg-dim: rgba(240,240,242,0.55);
    --accent: #7c93f5;
    --accent-strong: #93a6ff;
    --field-bg: rgba(255,255,255,0.06);
    --field-border: rgba(255,255,255,0.12);
  }
  *{ box-sizing: border-box; }
  html,body{
    margin:0; padding:0; height:100%; width:100%;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Arial, sans-serif;
    overflow:hidden;
    background:#111;
    -webkit-font-smoothing: antialiased;
  }

  #bg{
    position:fixed; inset:0;
    background-color:#111;
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
    transition: background-image .4s ease;
    z-index:0;
  }

  #center{
    position:fixed; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    z-index:2;
    pointer-events:none;
    text-align:center;
  }
  #modeLabel{
    color: var(--timer-color);
    letter-spacing:4px;
    font-size:1.1rem;
    text-transform:uppercase;
    opacity:0.85;
    margin-bottom:10px;
    text-shadow: 0 1px 6px rgba(0,0,0,0.5);
  }
  #timeDisplay{
    color: var(--timer-color);
    font-size:8rem;
    font-weight:300;
    line-height:1;
    font-variant-numeric: tabular-nums;
    text-shadow: 0 2px 12px rgba(0,0,0,0.5);
  }
  #timeDisplay.done{
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ opacity:1; }
    50%{ opacity:0.35; }
  }
  @media (max-width: 700px){
    #timeDisplay{ font-size:4rem; }
  }

  /* ---------- Settings card ---------- */

  #panel{
    position:fixed;
    top:20px; right:20px;
    width:300px;
    max-height:calc(100vh - 40px);
    overflow-y:auto;
    z-index:10;
    background: var(--card-bg);
    border:1px solid var(--card-border);
    border-radius:18px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    color: var(--fg);
    padding:18px;
    transition: opacity .3s ease, transform .3s ease;
  }
  #panel::-webkit-scrollbar{ width:6px; }
  #panel::-webkit-scrollbar-thumb{ background: rgba(255,255,255,0.15); border-radius:3px; }
  #panel.hidden{
    opacity:0;
    transform: translateY(-12px) scale(0.98);
    pointer-events:none;
  }
  @media (max-width: 560px){
    #panel{ left:12px; right:12px; top:12px; width:auto; }
  }

  .panel-header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:16px;
  }
  .panel-title{
    font-size:14px; font-weight:600; letter-spacing:0.2px;
  }
  .icon-btn{
    display:flex; align-items:center; justify-content:center;
    width:26px; height:26px;
    border-radius:8px;
    border:1px solid transparent;
    background:transparent;
    color: var(--fg-dim);
    font-size:14px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease;
  }
  .icon-btn:hover{ background: rgba(255,255,255,0.08); color:var(--fg); }

  .section{
    margin-bottom:16px;
  }
  .section:last-child{ margin-bottom:0; }
  .section-label{
    display:flex; align-items:center; gap:6px;
    font-size:11px;
    font-weight:600;
    letter-spacing:0.6px;
    text-transform:uppercase;
    color: var(--fg-dim);
    margin-bottom:9px;
  }

  /* segmented mode switch */
  .segmented{
    display:flex;
    background: var(--field-bg);
    border:1px solid var(--field-border);
    border-radius:11px;
    padding:3px;
    gap:3px;
  }
  .seg-btn{
    flex:1;
    border:none;
    background:transparent;
    color: var(--fg-dim);
    padding:8px 10px;
    border-radius:8px;
    font-size:13px;
    font-weight:500;
    cursor:pointer;
    transition: background .18s ease, color .18s ease, box-shadow .18s ease;
  }
  .seg-btn:hover{ color: var(--fg); }
  .seg-btn.active{
    background: var(--accent);
    color:#0d0d10;
    font-weight:600;
    box-shadow: 0 2px 8px rgba(124,147,245,0.4);
  }

  /* duration steppers */
  .duration-row{ display:flex; flex-direction:column; gap:8px; }
  .duration-item{
    display:flex; align-items:center; justify-content:space-between;
    gap:10px;
  }
  .duration-item > span{ font-size:13px; color:var(--fg-dim); flex-shrink:0; }
  .stepper{
    display:flex; align-items:center;
    background: var(--field-bg);
    border:1px solid var(--field-border);
    border-radius:9px;
    overflow:hidden;
  }
  .step-btn{
    width:26px; height:30px;
    border:none;
    background:transparent;
    color: var(--fg);
    font-size:15px;
    line-height:1;
    cursor:pointer;
    transition: background .15s ease;
  }
  .step-btn:hover{ background: rgba(255,255,255,0.1); }
  .stepper input[type=number]{
    width:38px;
    border:none;
    background:transparent;
    color: var(--fg);
    text-align:center;
    font-size:13px;
    font-variant-numeric: tabular-nums;
    -moz-appearance: textfield;
  }
  .stepper input[type=number]::-webkit-outer-spin-button,
  .stepper input[type=number]::-webkit-inner-spin-button{
    -webkit-appearance:none; margin:0;
  }
  .stepper input[type=number]:focus{ outline:none; }

  /* controls */
  .controls-row{ display:flex; gap:8px; }
  .btn-primary{
    flex:1;
    display:flex; align-items:center; justify-content:center; gap:6px;
    border:none;
    background: linear-gradient(135deg, var(--accent), var(--accent-strong));
    color:#0d0d10;
    font-weight:600;
    font-size:13.5px;
    padding:10px 12px;
    border-radius:10px;
    cursor:pointer;
    box-shadow: 0 4px 14px rgba(124,147,245,0.35);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-primary:hover{ transform: translateY(-1px); box-shadow: 0 6px 18px rgba(124,147,245,0.45); }
  .btn-primary:active{ transform: translateY(0); }
  .btn-secondary{
    display:flex; align-items:center; justify-content:center;
    width:40px;
    border:1px solid var(--field-border);
    background: var(--field-bg);
    color: var(--fg);
    font-size:15px;
    border-radius:10px;
    cursor:pointer;
    transition: background .15s ease;
  }
  .btn-secondary:hover{ background: rgba(255,255,255,0.12); }

  .hint-text{
    margin-top:9px;
    font-size:11.5px;
    color: var(--fg-dim);
    text-align:center;
  }
  kbd{
    display:inline-block;
    padding:1px 6px;
    border:1px solid var(--field-border);
    border-radius:5px;
    background: var(--field-bg);
    color: var(--fg);
    font-family:inherit;
    font-size:11px;
    font-weight:600;
  }

  /* background upload */
  .upload-btn{
    display:flex; align-items:center; justify-content:center; gap:6px;
    width:100%;
    padding:9px 12px;
    border:1px dashed var(--field-border);
    border-radius:10px;
    background: var(--field-bg);
    color: var(--fg-dim);
    font-size:12.5px;
    cursor:pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
    margin-bottom:10px;
  }
  .upload-btn:hover{
    background: rgba(255,255,255,0.1);
    color: var(--fg);
    border-color: rgba(255,255,255,0.25);
  }

  #gallery{
    display:flex; flex-wrap:wrap; gap:7px;
    max-height:140px;
    overflow-y:auto;
  }
  #gallery:empty{ display:none; }
  .thumb{
    position:relative;
    width:52px; height:52px;
    border-radius:9px;
    overflow:hidden;
    cursor:pointer;
    border:2px solid transparent;
    background-size:cover;
    background-position:center;
    flex-shrink:0;
    transition: border-color .15s ease, transform .12s ease;
  }
  .thumb:hover{ transform: scale(1.04); }
  .thumb.active{ border-color: var(--accent); }
  .thumb .del{
    position:absolute; top:0; right:0;
    background:rgba(0,0,0,0.65);
    color:#fff;
    width:18px; height:18px;
    font-size:12px;
    line-height:18px;
    text-align:center;
    border-radius:0 0 0 8px;
  }
  .thumb .del:hover{ background:rgba(220,60,60,0.9); }
</style>
</head>
<body>

<div id="bg"></div>

<div id="center">
  <div id="modeLabel">Баба Нам Кевалам</div>
  <div id="timeDisplay">20:00</div>
</div>

<div id="panel">
  <div class="panel-header">
    <span class="panel-title">Настройки</span>
    <button id="hideBtn" class="icon-btn" title="Скрыть панель (H)">✕</button>
  </div>

  <div class="section">
    <div class="section-label">Режим</div>
    <div class="segmented">
      <button id="modeKiirtan" class="seg-btn active">Баба Нам Кевалам</button>
      <button id="modeMeditation" class="seg-btn">Медитация</button>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Длительность, мин</div>
    <div class="duration-row">
      <div class="duration-item">
        <span>Баба Нам Кевалам</span>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="durKiirtan" data-delta="-1">−</button>
          <input type="number" id="durKiirtan" min="1" max="180" value="20">
          <button type="button" class="step-btn" data-target="durKiirtan" data-delta="1">+</button>
        </div>
      </div>
      <div class="duration-item">
        <span>Медитация</span>
        <div class="stepper">
          <button type="button" class="step-btn" data-target="durMeditation" data-delta="-1">−</button>
          <input type="number" id="durMeditation" min="1" max="180" value="20">
          <button type="button" class="step-btn" data-target="durMeditation" data-delta="1">+</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-label">Управление</div>
    <div class="controls-row">
      <button id="startPause" class="btn-primary">▶ Старт</button>
      <button id="reset" class="btn-secondary" title="Сброс">↺</button>
      <button id="fullscreenBtn" class="btn-secondary" title="Полный экран (F)">⛶</button>
    </div>
    <div class="hint-text">Нажмите <kbd>H</kbd> — скрыть панель, <kbd>F</kbd> — полный экран</div>
  </div>

  <div class="section">
    <div class="section-label">Фон</div>
    <label for="upload" class="upload-btn">+ Добавить фото</label>
    <input type="file" id="upload" accept="image/*" multiple hidden>
    <div id="gallery"></div>
  </div>
</div>


<script>
(function(){
  const LS_KEYS = {
    images: 'med_images',
    activeImage: 'med_active_image',
    durations: 'med_durations',
    mode: 'med_mode'
  };

  const modeLabel = document.getElementById('modeLabel');
  const timeDisplay = document.getElementById('timeDisplay');
  const panel = document.getElementById('panel');
  const bg = document.getElementById('bg');
  const gallery = document.getElementById('gallery');
  const upload = document.getElementById('upload');
  const startPauseBtn = document.getElementById('startPause');
  const resetBtn = document.getElementById('reset');
  const hideBtn = document.getElementById('hideBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const modeKiirtanBtn = document.getElementById('modeKiirtan');
  const modeMeditationBtn = document.getElementById('modeMeditation');
  const durKiirtanInput = document.getElementById('durKiirtan');
  const durMeditationInput = document.getElementById('durMeditation');

  let durations = JSON.parse(localStorage.getItem(LS_KEYS.durations) || 'null') || { kiirtan: 20, meditation: 20 };
  let mode = localStorage.getItem(LS_KEYS.mode) || 'kiirtan';
  let remaining = durations[mode] * 60;
  let running = false;
  let timerInterval = null;
  let manuallyHidden = false;

  durKiirtanInput.value = durations.kiirtan;
  durMeditationInput.value = durations.meditation;

  function saveDurations(){
    localStorage.setItem(LS_KEYS.durations, JSON.stringify(durations));
  }

  function formatTime(sec){
    sec = Math.max(0, Math.round(sec));
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function render(){
    modeLabel.textContent = mode === 'kiirtan' ? 'Баба Нам Кевалам' : 'Медитация';
    timeDisplay.textContent = formatTime(remaining);
    timeDisplay.classList.toggle('done', remaining <= 0);
    modeKiirtanBtn.classList.toggle('active', mode === 'kiirtan');
    modeMeditationBtn.classList.toggle('active', mode === 'meditation');
    startPauseBtn.innerHTML = running ? '⏸ Пауза' : '▶ Старт';
  }

  function setMode(newMode){
    stopTimer();
    mode = newMode;
    localStorage.setItem(LS_KEYS.mode, mode);
    remaining = durations[mode] * 60;
    render();
  }

  function tick(){
    remaining -= 1;
    if (remaining <= 0){
      remaining = 0;
      stopTimer();
      beep();
    }
    render();
  }

  function startTimer(){
    if (remaining <= 0) remaining = durations[mode] * 60;
    running = true;
    timerInterval = setInterval(tick, 1000);
    render();
  }

  function stopTimer(){
    running = false;
    clearInterval(timerInterval);
    timerInterval = null;
    render();
  }

  function beep(){
    try{
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain); gain.connect(ctx.destination);
      osc.frequency.value = 528;
      gain.gain.setValueAtTime(0.0001, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.3, ctx.currentTime + 0.05);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 2.5);
      osc.start();
      osc.stop(ctx.currentTime + 2.6);
    }catch(e){}
  }

  startPauseBtn.addEventListener('click', () => {
    if (running) stopTimer(); else startTimer();
  });
  resetBtn.addEventListener('click', () => {
    stopTimer();
    remaining = durations[mode] * 60;
    render();
  });
  modeKiirtanBtn.addEventListener('click', () => setMode('kiirtan'));
  modeMeditationBtn.addEventListener('click', () => setMode('meditation'));

  durKiirtanInput.addEventListener('change', () => {
    let v = Math.max(1, Math.min(180, parseInt(durKiirtanInput.value, 10) || 20));
    durKiirtanInput.value = v;
    durations.kiirtan = v;
    saveDurations();
    if (mode === 'kiirtan' && !running) { remaining = v * 60; render(); }
  });
  durMeditationInput.addEventListener('change', () => {
    let v = Math.max(1, Math.min(180, parseInt(durMeditationInput.value, 10) || 20));
    durMeditationInput.value = v;
    durations.meditation = v;
    saveDurations();
    if (mode === 'meditation' && !running) { remaining = v * 60; render(); }
  });

  document.querySelectorAll('.step-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const input = document.getElementById(btn.dataset.target);
      const delta = parseInt(btn.dataset.delta, 10);
      let v = (parseInt(input.value, 10) || 0) + delta;
      v = Math.max(1, Math.min(180, v));
      input.value = v;
      input.dispatchEvent(new Event('change'));
    });
  });

  // ---- Background images (stored as compressed data URLs in localStorage) ----

  function getImages(){
    return JSON.parse(localStorage.getItem(LS_KEYS.images) || '[]');
  }
  function saveImages(list){
    localStorage.setItem(LS_KEYS.images, JSON.stringify(list));
  }
  function getActiveImageId(){
    return localStorage.getItem(LS_KEYS.activeImage);
  }
  function setActiveImageId(id){
    localStorage.setItem(LS_KEYS.activeImage, id);
    applyBackground();
  }
  function applyBackground(){
    const images = getImages();
    const activeId = getActiveImageId();
    const img = images.find(i => i.id === activeId) || images[0];
    bg.style.backgroundImage = img ? `url(${img.data})` : 'none';
  }

  function renderGallery(){
    const images = getImages();
    const activeId = getActiveImageId();
    gallery.innerHTML = '';
    images.forEach(img => {
      const div = document.createElement('div');
      div.className = 'thumb' + (img.id === activeId ? ' active' : '');
      div.style.backgroundImage = `url(${img.data})`;
      div.title = 'Нажмите, чтобы выбрать фон';
      div.addEventListener('click', () => {
        setActiveImageId(img.id);
        renderGallery();
      });
      const del = document.createElement('div');
      del.className = 'del';
      del.textContent = '×';
      del.title = 'Удалить';
      del.addEventListener('click', (e) => {
        e.stopPropagation();
        const list = getImages().filter(i => i.id !== img.id);
        saveImages(list);
        if (getActiveImageId() === img.id){
          localStorage.setItem(LS_KEYS.activeImage, list.length ? list[0].id : '');
        }
        renderGallery();
        applyBackground();
      });
      div.appendChild(del);
      gallery.appendChild(div);
    });
  }

  function compressImage(file, maxDim, quality){
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width, height } = img;
          if (width > height && width > maxDim){
            height = Math.round(height * (maxDim / width));
            width = maxDim;
          } else if (height > maxDim){
            width = Math.round(width * (maxDim / height));
            height = maxDim;
          }
          const canvas = document.createElement('canvas');
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          resolve(canvas.toDataURL('image/jpeg', quality));
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  upload.addEventListener('change', async () => {
    const files = Array.from(upload.files || []);
    for (const file of files){
      try{
        const dataUrl = await compressImage(file, 1920, 0.82);
        const id = 'img_' + Date.now() + '_' + Math.random().toString(36).slice(2,8);
        const list = getImages();
        list.push({ id, data: dataUrl });
        saveImages(list);
        if (!getActiveImageId()) setActiveImageId(id);
      }catch(err){
        console.error('Не удалось загрузить изображение', err);
      }
    }
    renderGallery();
    applyBackground();
    upload.value = '';
  });

  // ---- Auto-hide UI ----

  let hideTimeout = null;
  function showPanel(){
    panel.classList.remove('hidden');
    scheduleHide();
  }
  function scheduleHide(){
    clearTimeout(hideTimeout);
    if (manuallyHidden) return;
    hideTimeout = setTimeout(() => {
      const activeInPanel = panel.contains(document.activeElement);
      if (!activeInPanel){
        panel.classList.add('hidden');
      } else {
        scheduleHide();
      }
    }, 3500);
  }

  document.addEventListener('mousemove', () => {
    if (manuallyHidden) return;
    showPanel();
  });
  document.addEventListener('click', () => {
    if (manuallyHidden) return;
    showPanel();
  });

  hideBtn.addEventListener('click', () => {
    manuallyHidden = true;
    clearTimeout(hideTimeout);
    panel.classList.add('hidden');
  });

  function toggleFullscreen(){
    if (!document.fullscreenElement){
      document.documentElement.requestFullscreen?.().catch(() => {});
    } else {
      document.exitFullscreen?.();
    }
  }
  fullscreenBtn.addEventListener('click', toggleFullscreen);

  document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'h' || e.key === 'H'){
      manuallyHidden = !manuallyHidden;
      if (manuallyHidden){
        clearTimeout(hideTimeout);
        panel.classList.add('hidden');
      } else {
        showPanel();
      }
    } else if (e.key === 'f' || e.key === 'F'){
      toggleFullscreen();
    }
  });

  // ---- Init ----
  render();
  renderGallery();
  applyBackground();
  scheduleHide();
})();
</script>

</body>
</html>
